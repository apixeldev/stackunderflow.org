<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Underflow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, #242424 0%, #111 45%, #080808 100%);
            color: #eee;
        }

        main {
            width: min(700px, calc(100% - 40px));
            padding: 50px;
            text-align: center;
            background: rgba(25, 25, 25, 0.85);
            border: 1px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .prompt {
            color: #777;
            font-family: monospace;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: -0.05em;
        }

        h1 span {
            color: #7dd3fc;
        }

        p {
            margin: 25px auto 0;
            max-width: 520px;
            color: #aaa;
            font-size: 1.15rem;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 30px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #1d2a1f;
            border: 1px solid #315238;
            color: #9be7a6;
            font-family: monospace;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 35px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <main>
        <div class="prompt">$ ./stackunderflow</div>

        <h1>I'll get to it<span>™</span></h1>

        <p>
            I do have this site, but I have not started to actually make it, give me some time, much love, apixeldev.
        </p>

        <div class="status">● development temporarily underflowing</div>

        <footer>
            stackunderflow.org
        </footer>
    </main>
</body>
</html>
